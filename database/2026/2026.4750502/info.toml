[article]

title = """
Desktop Mouse Use Shifts Masturbation Handedness Through Task Competition
"""
abstract = """
Traditional explanations of hand preference emphasize stable motor dominance and innate manual specialization. However, such models may not adequately explain why a subset of consistently right-handed men preferentially use their left hand during masturbation. The present study examines the Competition-Induced Handedness Separation Hypothesis, which proposes that this behavioral pattern emerges from early motor-resource competition rather than reduced right-hand dominance. Specifically, the study assumes that during early masturbation experiences, many right-handed individuals simultaneously engaged in computer-based activities that required operation of a computer mouse with the dominant right hand. Because mouse control was perceived as the higher-priority task, the lower-priority task of genital stimulation was delegated to the left hand. Repeated exposure to this dual-task environment may have resulted in a persistent motor habit that remained stable even after the original environmental conditions disappeared.
"""


